<!-- auth_base.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authentication</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#336357,#227765,#00b991);
            font-family:Arial, Helvetica, sans-serif;
            padding:20px;
        }

        .auth-card{
            width:100%;
            max-width:450px;
            background:white;
            padding:40px 30px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .auth-title{
            text-align:center;
            font-size:32px;
            font-weight:bold;
            color:#0f172a;
            margin-bottom:30px;
        }

        .form-control{
            height:50px;
            border-radius:12px;
            border:1px solid #cbd5e1;
            font-size:16px;
            padding-left:15px;
        }

        .form-control:focus{
            box-shadow:none;
            border-color: #00885b;
        }

        .btn-auth{
            width:100%;
            height:50px;
            border:none;
            border-radius:12px;
            background: #00885b;
            color:white;
            font-size:18px;
            font-weight:600;
            transition:0.3s;
        }

        .btn-auth:hover{
            background: #00885b;
        }

        .register-links{
            text-align:center;
            margin-top:25px;
        }

        .register-links a{
            text-decoration:none;
            color: #00885b;
            font-weight:600;
            transition:0.3s;
        }

        .register-links a:hover{
            color: #00885b;
        }

        .divider{
            margin:12px 0;
            color:#64748b;
        }

        @media(max-width:576px){

            .auth-card{
                padding:30px 20px;
            }

            .auth-title{
                font-size:26px;
            }

        }

    </style>

</head>

<body>

    <div class="auth-card">

        {% block content %}
        {% endblock %}

    </div>

</body>

</html>
