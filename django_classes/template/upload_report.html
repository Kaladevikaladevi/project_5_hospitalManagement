{% extends "base.html" %}

{% block title %}
<title>Upload Report - City Hospital</title>
{% endblock %}

{% block content %}

<style>

/* =========================
    UPLOAD REPORT STYLE
========================= */

body{
    background: #f8fafc;
}

/* SECTION */
.upload-section{
    padding: 70px 0;
}

/* CARD */
.upload-card{
    background: white;
    border-radius: 25px;
    padding: 40px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.10);
    border: 1px solid rgba(20,184,166,0.12);
    transition: 0.3s ease;
}

.upload-card:hover{
    transform: translateY(-5px);
    box-shadow: 0 18px 45px rgba(0,0,0,0.12);
}

/* TITLE */
.upload-title{
    font-size: 32px;
    font-weight: 800;
    color: #0f766e;
    margin-bottom: 20px;
}

/* FILE INPUT STYLE */
input[type="file"]{
    border: 2px dashed #14b8a6;
    padding: 20px;
    border-radius: 15px;
    background: #f0fdfa;
    width: 100%;
    cursor: pointer;
    transition: 0.3s ease;
}

/* FILE HOVER */
input[type="file"]:hover{
    background: #ccfbf1;
    border-color: #0f766e;
}

/* BUTTON */
.btn-primary{
    background: linear-gradient(135deg, #0f766e, #14b8a6);
    border: none;
    padding: 12px 30px;
    font-weight: 600;
    border-radius: 50px;
    transition: 0.3s ease;
    box-shadow: 0 8px 20px rgba(20,184,166,0.25);
}

.btn-primary:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(20,184,166,0.35);
}

/* ALERT */
.alert{
    border-radius: 12px;
    font-weight: 500;
}

/* RESPONSIVE */
@media(max-width:768px){

    .upload-card{
        padding: 25px;
    }

    .upload-title{
        font-size: 24px;
        text-align: center;
    }

}

</style>

<!-- =========================
        UPLOAD SECTION
========================== -->

<section class="upload-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="upload-card">

                    <!-- TITLE -->
                    <h2 class="upload-title text-center">
                        Upload Medical Report
                    </h2>

                    <!-- SUCCESS MESSAGES -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-success text-center">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <!-- FORM -->
                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <!-- FILE INPUT -->
                        <input type="file" name="report" required>

                        <!-- BUTTON -->
                        <div class="text-center mt-4">

                            <button type="submit" class="btn btn-primary px-5">

                                Upload Report

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
